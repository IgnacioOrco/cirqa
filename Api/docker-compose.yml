version: '3.8'

services:
  # Servicio de la API Express
  api:
    build: .
    container_name: cirqa-api
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/cirqa
      - JWT_SECRET=cirqa_secret_jwt_key_prod_2026
      - CLIENT_URL=https://www.cirqa.com.ar,https://cirqa.com.ar
      - NODE_OPTIONS=--max-old-space-size=512
      - ZIPNOVA_ACCOUNT_ID=${ZIPNOVA_ACCOUNT_ID:-22018}
      - ZIPNOVA_KEY=${ZIPNOVA_KEY:-51928c80-c2b9-4294-82ad-6af0203f5a28}
      - ZIPNOVA_SECRET=${ZIPNOVA_SECRET:-6d627a5e-2274-4c6f-a01a-185f1493f192}
      - ZIPNOVA_API_URL=${ZIPNOVA_API_URL:-https://api.zipnova.com.ar}
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      # =========================================================================
      # VOLUMEN PERSISTENTE: Mapea la carpeta ../uploads del host VPS a /app/uploads
      # Garantiza que las imágenes subidas no se pierdan al rebuildear el contenedor
      # =========================================================================
      - ../uploads:/app/uploads
    depends_on:
      - mongo

  # Servicio de Base de Datos MongoDB con protección OOM (Exit 137)
  mongo:
    image: mongo:6-jammy
    container_name: cirqa-mongo
    restart: always
    command: mongod --wiredTigerCacheSizeGB 0.25
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      # Bindeo a localhost para proteger contra bots maliciosos en internet
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
    name: cirqa_mongo_data

